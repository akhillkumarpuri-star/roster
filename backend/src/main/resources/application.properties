spring.application.name=roster-api
server.port=8080

# MySQL - override with env vars DB_USER / DB_PASSWORD if needed
spring.datasource.url=jdbc:mysql://localhost:3306/roster_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# The schema is owned by Flyway (src/main/resources/db/migration), not generated by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false

# JWT - secret must be at least 32 characters. Set JWT_SECRET in any real environment.
app.jwt.secret=${JWT_SECRET:roster-dev-secret-change-me-please-32chars-min}
app.jwt.expiration-minutes=30

app.cors.allowed-origin=http://localhost:4200
