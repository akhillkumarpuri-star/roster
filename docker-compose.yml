# Optional: run MySQL without installing it. Matches the defaults in backend application.properties.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: roster_db
    ports:
      - "3306:3306"
    volumes:
      - roster_data:/var/lib/mysql
volumes:
  roster_data:
